server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Winston JSON (combined.log já inclui error; não raspar error.log para evitar duplicata)
  - job_name: gas-e-agua-app-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: gas-e-agua-backend
          __path__: /var/log/app/combined.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            type: type
            timestamp: timestamp
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          type:

  # Stdout do container da API (crash/npm). Job separado para não duplicar no Grafana.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/gas-e-agua-app.*"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.+)"
        target_label: "container_name"
        replacement: "${1}"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/gas-e-agua-app.*"
        target_label: "job"
        replacement: "gas-e-agua-backend-stdout"
    pipeline_stages:
      - labels:
          container_name:
          stream:
          job:
