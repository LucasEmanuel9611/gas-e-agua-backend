name: "Database Backup"
description: "Creates a backup of the database before deployment"

inputs:
  environment:
    description: "Environment to backup (dev or prd)"
    required: true
  ssh-key:
    description: "SSH private key"
    required: true
  vps-host:
    description: "VPS hostname"
    required: true
  vps-user:
    description: "VPS user"
    required: true
  mysql-root-password:
    description: "MySQL root password (preferred over .env on disk)"
    required: false
    default: ""
  mysql-database:
    description: "MySQL database name"
    required: false
    default: ""

outputs:
  backup-file:
    description: "Path to the created backup file"
    value: ${{ steps.backup.outputs.file }}

runs:
  using: "composite"
  steps:
    - name: Create database backup
      id: backup
      shell: bash
      env:
        MYSQL_ROOT_PASSWORD: ${{ inputs.mysql-root-password }}
        MYSQL_DATABASE: ${{ inputs.mysql-database }}
      run: |
        set -e

        echo "📦 Executando backup no ambiente: ${{ inputs.environment }}"
        echo ""

        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ inputs.vps-user }}@${{ inputs.vps-host }} bash <<EOF
        set -e
        cd /home/deploy/gas-e-agua-backend
        export MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD"
        export MYSQL_DATABASE="$MYSQL_DATABASE"
        bash ./scripts/deploy/backup-db.sh ${{ inputs.environment }}
        EOF

        echo ""
        echo "✅ Backup concluído com sucesso!"
