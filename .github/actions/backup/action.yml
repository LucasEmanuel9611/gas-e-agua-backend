name: "Database Backup"
description: "Creates a backup of the database before deployment"

inputs:
  environment:
    description: "Environment to backup (dev or prd)"
    required: true
  ssh-key:
    description: "SSH private key"
    required: true
  vps-host:
    description: "VPS hostname"
    required: true
  vps-user:
    description: "VPS user"
    required: true

outputs:
  backup-file:
    description: "Path to the created backup file"
    value: ${{ steps.backup.outputs.file }}

runs:
  using: "composite"
  steps:
    - name: Create database backup
      id: backup
      shell: bash
      run: |
        ENV="${{ inputs.environment }}"
        BACKUP_OUTPUT=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ inputs.vps-user }}@${{ inputs.vps-host }} bash -s << EOF
        set -e
        cd /home/deploy/gas-e-agua-backend
        chmod +x scripts/*.sh
        ./scripts/backup-db.sh $ENV
        EOF
        )

        BACKUP_FILE=$(echo "$BACKUP_OUTPUT" | grep "Backup created:" | awk '{print $3}')

        if [ -z "$BACKUP_FILE" ]; then
          echo "❌ Failed to extract backup file path"
          echo "Output: $BACKUP_OUTPUT"
          exit 1
        fi

        echo "file=$BACKUP_FILE" >> $GITHUB_OUTPUT
        echo "✅ Backup created: $BACKUP_FILE"
